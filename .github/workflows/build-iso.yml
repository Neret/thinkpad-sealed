name: Build Sealed Installer ISO

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Immagine sealed da includere nell'ISO"
        required: true
        default: "ghcr.io/neret/fedora-bootc-sealed-os:sealed"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Copy MOK into ISO skeleton
        run: |
          mkdir -p iso/mkosi.skeleton/usr/local/share/mok
          cp secureboot/MOK.cer iso/mkosi.skeleton/usr/local/share/mok/MOK.cer

      - name: Make installer script executable
        run: |
          chmod +x iso/mkosi.skeleton/usr/local/sbin/install-sealed-os

      - name: Build installer image
        env:
          SEALED_IMAGE: ${{ inputs.image_ref }}
        run: |
          cd iso
          echo "${SEALED_IMAGE}" > SEALED_IMAGE
          sudo podman run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/iso \
            quay.io/fedora/fedora:45 \
            bash -c "dnf install -y mkosi && mkosi build"

      - name: Upload installer image
        uses: actions/upload-artifact@v4
        with:
          name: fedora-bootc-sealed-os-installer
          path: iso/sealed-installer.raw
          retention-days: 7
