name: Build Sealed Image

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Custom OS"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: build-sealed
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/neret/fedora-bootc-sealed-os

jobs:
  seal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache

      - name: Set tag
        run: echo "TAG=sealed-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Write signing key
        env:
          SB_KEY: ${{ secrets.SECUREBOOT_KEY }}
          SB_CERT: ${{ secrets.SECUREBOOT_CERT }}
        run: |
          umask 077
          printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/mok.key"
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/mok.crt"

      # Tutto resta nello stesso storage: niente immagine "unsealed" nel registry.
      - name: Build unsealed image (systemd-boot firmato, senza bootupd)
        run: |
          sudo podman build --pull=always \
            -f seal/Containerfile.unsealed \
            -t "localhost/unsealed:${TAG}" \
            --secret "id=key,src=${RUNNER_TEMP}/mok.key" \
            --secret "id=cert,src=${RUNNER_TEMP}/mok.crt" \
            .

      - name: Build slim image (su questa si calcola il digest)
        run: |
          sudo podman build --pull=never \
            -f seal/Containerfile.seal --target slim \
            --build-arg "UNSEALED=localhost/unsealed:${TAG}" \
            -t "localhost/slim:${TAG}" \
            .

      # Stessa vista di "bootc install": digest dallo storage, con il bootc dell'immagine.
      - name: Compute composefs digests from storage
        run: |
          for v in v1 v2; do
            d="$(sudo podman run --rm --privileged --pid=host --security-opt label=disable \
              -v /var/lib/containers:/var/lib/containers \
              "localhost/slim:${TAG}" \
              bootc container compute-composefs-digest-from-storage \
              --erofs-version "$v" "localhost/slim:${TAG}" | tail -n1)"
            [[ "$d" =~ ^[0-9a-f]{128}$ ]] || { echo "digest ${v} non valido: ${d}"; exit 1; }
            echo "COMPOSEFS_${v^^}=${d}" >> "$GITHUB_ENV"
            echo "composefs ${v}: ${d}"
          done

      - name: Build sealed image (UKI firmata con la chiave MOK)
        run: |
          sudo podman build --pull=missing \
            -f seal/Containerfile.seal --target final \
            --build-arg "UNSEALED=localhost/unsealed:${TAG}" \
            --build-arg "COMPOSEFS_V1=${COMPOSEFS_V1}" \
            --build-arg "COMPOSEFS_V2=${COMPOSEFS_V2}" \
            --secret "id=key,src=${RUNNER_TEMP}/mok.key" \
            --secret "id=cert,src=${RUNNER_TEMP}/mok.crt" \
            -t "${IMAGE}:${TAG}" \
            .

      # Controllo rapido (secondi): la UKI porta sia il digest v1 sia il v2 nella command line,
      # quindi devono coincidere ENTRAMBI con quelli dell'immagine finale.
      - name: Check final image digest matches the one in the UKI
        run: |
          ok=0
          for v in v1 v2; do
            d="$(sudo podman run --rm --privileged --pid=host --security-opt label=disable \
              -v /var/lib/containers:/var/lib/containers \
              "${IMAGE}:${TAG}" \
              bootc container compute-composefs-digest-from-storage \
              --erofs-version "$v" "${IMAGE}:${TAG}" | tail -n1)"
            var="COMPOSEFS_${v^^}"
            echo "${v}: finale=${d}"
            echo "${v}: uki   =${!var}"
            if [ "$d" = "${!var}" ]; then
              ok=$((ok + 1))
            else
              echo "ERRORE: il digest ${v} dell'immagine finale non coincide con quello nella UKI"
            fi
          done
          [ "$ok" = 2 ] || { echo "Digest v1/v2 non coincidenti con la UKI: immagine non pubblicata"; exit 1; }

      - name: Verify signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sbsigntool
          sudo podman run --rm "${IMAGE}:${TAG}" sh -c 'cat /boot/EFI/Linux/*.efi' > "$RUNNER_TEMP/uki.efi"
          sudo podman run --rm "${IMAGE}:${TAG}" cat /usr/lib/systemd/boot/efi/systemd-bootx64.efi > "$RUNNER_TEMP/sdboot.efi"
          sbverify --cert "$RUNNER_TEMP/mok.crt" "$RUNNER_TEMP/uki.efi"
          sbverify --cert "$RUNNER_TEMP/mok.crt" "$RUNNER_TEMP/sdboot.efi"
          {
            echo "### ${IMAGE}:${TAG}"
            echo "- certificato: $(openssl x509 -in "$RUNNER_TEMP/mok.crt" -noout -fingerprint -sha256)"
            echo "- UKI: $(ls -lh "$RUNNER_TEMP/uki.efi" | awk '{print $5}')"
          } >> "$GITHUB_STEP_SUMMARY"

      # Se il digest nella UKI non coincide con l'immagine, bootc install fallisce qui
      # e l'immagine non viene pubblicata.
      - name: Rehearsal - bootc install su disco loopback
        run: |
          sudo mkdir -p /mnt/rehearsal
          sudo truncate -s 24G /mnt/rehearsal/disk.raw
          sudo podman run --rm --privileged --pid=host --security-opt label=disable \
            -v /dev:/dev \
            -v /var/lib/containers:/var/lib/containers \
            -v /mnt/rehearsal:/data \
            "${IMAGE}:${TAG}" \
            bootc install to-disk --via-loopback --composefs-backend \
            --bootloader systemd --filesystem btrfs /data/disk.raw

      - name: Push sealed image (tag univoco e tag mobile "sealed")
        run: |
          sudo podman push "${IMAGE}:${TAG}"
          sudo podman tag "${IMAGE}:${TAG}" "${IMAGE}:sealed"
          sudo podman push "${IMAGE}:sealed"

      - name: Remove signing key
        if: always()
        run: shred -u "$RUNNER_TEMP/mok.key" "$RUNNER_TEMP/mok.crt" || true
