name: Build Sealed Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "seal/**"
      - ".github/workflows/build-sealed.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/neret/fedora-bootc-sealed-os
  TOOLS_IMAGE: quay.io/fedora/fedora:45

jobs:
  build-unsealed:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sealed-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Write secure boot secrets
        run: |
          printf '%s' "${{ secrets.SECUREBOOT_KEY }}" > /tmp/mok.key
          printf '%s' "${{ secrets.SECUREBOOT_CERT }}" > /tmp/mok.crt

      - name: Build unsealed image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          sudo podman build \
            --pull=always \
            -f seal/Containerfile.unsealed \
            -t "${IMAGE}:unsealed-${TAG}" \
            --secret id=key,src=/tmp/mok.key \
            --secret id=cert,src=/tmp/mok.crt \
            .

      - name: Push unsealed image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          sudo podman push "${IMAGE}:unsealed-${TAG}"

  build-slim-and-digest:
    needs: build-unsealed
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Build slim image
        env:
          TAG: ${{ needs.build-unsealed.outputs.tag }}
        run: |
          sudo podman build \
            --pull=never \
            -f seal/Containerfile.slim \
            --build-arg BASE="${IMAGE}:unsealed-${TAG}" \
            -t localhost/thinkpad-slim:${TAG} \
            .

      - name: Compute composefs digest
        id: digest
        env:
          TAG: ${{ needs.build-unsealed.outputs.tag }}
        run: |
          DIGEST="$(sudo podman run --rm \
            --mount type=image,source=localhost/thinkpad-slim:${TAG},target=/target \
            ${TOOLS_IMAGE} \
            bash -c '
              dnf -y install bootc >/dev/null
              bootc container compute-composefs-digest /target
            ' | tail -n1)"

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Composefs digest: ${DIGEST}"

  build-sealed:
    needs: [build-unsealed, build-slim-and-digest]
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Write secure boot secrets
        run: |
          printf '%s' "${{ secrets.SECUREBOOT_KEY }}" > /tmp/mok.key
          printf '%s' "${{ secrets.SECUREBOOT_CERT }}" > /tmp/mok.crt

      - name: Build sealed image
        id: meta
        env:
          TAG: ${{ needs.build-unsealed.outputs.tag }}
          DIGEST: ${{ needs.build-slim-and-digest.outputs.digest }}
        run: |
          IMAGE_REF="${IMAGE}:${TAG}"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

          sudo podman build \
            --pull=never \
            -f seal/Containerfile.seal \
            --target final \
            -t "${IMAGE_REF}" \
            --build-arg UNSEALED="${IMAGE}:unsealed-${TAG}" \
            --secret id=key,src=/tmp/mok.key \
            --secret id=cert,src=/tmp/mok.crt \
            --build-arg COMPOSEFS_DIGEST="${DIGEST}" \
            .

      - name: Push sealed image
        env:
          TAG: ${{ needs.build-unsealed.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          sudo podman push "${IMAGE}:${TAG}"
