name: Build Custom OS

on:
  schedule:
    - cron: "50 13 * * *"
      timezone: "Europe/Rome"
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "containers/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
      - ".github/workflows/seal.yml"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  build:
    name: Base e immagine
    needs: lint
    # rpm-ostree's bubblewrapped systemd-sysusers fails to read /etc/gshadow on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    environment: signing
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Fedora Minimal bootc base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/Containerfile.base
          push: true
          provenance: false
          tags: ghcr.io/neret/fedora-bootc-sealed-os-minimal-base:45
          allow: security.insecure

      - name: Build Custom Image
        uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14.0
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          digestfile: ${{ runner.temp }}/digests.json

      - name: Read image digest
        id: digest
        run: |
          set -euo pipefail
          digest="$(jq -er 'if length == 1 then to_entries[0].value else error("attesa una sola immagine") end' "$RUNNER_TEMP/digests.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest non valido: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  seal:
    name: Seal e firma
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/seal.yml
    with:
      base_digest: ${{ needs.build.outputs.digest }}
    secrets: inherit
