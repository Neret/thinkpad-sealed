name: Build Custom OS

on:
  schedule:
    - cron: "0 4 * * 0"
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - "tests/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e test degli script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Installa sbsigntool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sbsigntool

      - name: ShellCheck
        run: |
          shellcheck -x -S warning \
            files/system/usr/libexec/sealed-sync \
            files/system/usr/libexec/sealed-sync-lib \
            files/system/usr/libexec/sealed-sync.d/* \
            tests/sealed-sync.test.sh \
            installer.sh check.sh

      - name: Test
        run: bash tests/sealed-sync.test.sh

  build:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
