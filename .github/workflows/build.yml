name: Build Custom OS

on:
  schedule:
    - cron: "0 4 * * 0"
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "containers/**"
      - "files/**"
      - "cosign.pub"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint e test degli script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Installa sbsigntool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sbsigntool

      - name: ShellCheck
        run: |
          shellcheck -x -S warning \
            files/scripts/*.sh

  build:
    name: Build and Push
    needs: test
    # rpm-ostree's bubblewrapped systemd-sysusers fails to read /etc/gshadow on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Fedora Minimal bootc base
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: containers/Containerfile.base
          push: true
          tags: ghcr.io/neret/fedora-bootc-sealed-os-minimal-base:45
          allow: security.insecure

      - name: Build Custom Image
        uses: blue-build/github-action@v1.14.0
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
