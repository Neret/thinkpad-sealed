name: Lint

on:
  push:
    branches:
      - main
    paths:
      - "install.sh"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: |
          shellcheck -x -S warning \
            install.sh \
            containers/scripts/*.sh \
            files/scripts/*.sh \
            files/system/usr/bin/sealed-*
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color -shellcheck=
