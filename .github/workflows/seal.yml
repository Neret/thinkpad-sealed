name: Build Sealed Image

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-sealed
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/neret/fedora-bootc-sealed-os
  CHUNKAH: quay.io/coreos/chunkah@sha256:71e593421c5de7dcc7c8c5c50e98d3bac572055a76f399f61a491d123c20a523

jobs:
  seal:
    runs-on: ubuntu-24.04
    environment: signing
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache

      - name: Set tag
        run: echo "TAG=sealed-$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Registry login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.4.3"

      - name: Login cosign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Resolve pinned input images
        run: |
          set -euo pipefail
          sudo podman pull -q quay.io/fedora/fedora-bootc:45 >/dev/null
          sudo podman pull -q "${IMAGE}:latest" >/dev/null
          tools_digest="$(sudo podman image inspect --format '{{.Digest}}' quay.io/fedora/fedora-bootc:45)"
          base_digest="$(sudo podman image inspect --format '{{.Digest}}' "${IMAGE}:latest")"
          test -n "${tools_digest}" && test -n "${base_digest}"
          cosign verify --key cosign.pub "${IMAGE}@${base_digest}" >/dev/null
          {
            echo "TOOLS=quay.io/fedora/fedora-bootc:45@${tools_digest}"
            echo "BASE=${IMAGE}@${base_digest}"
          } >> "$GITHUB_ENV"
          {
            echo "### Immagini di input"
            echo "- TOOLS: ${tools_digest}"
            echo "- BASE: ${base_digest}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write signing keys
        env:
          SB_KEY: ${{ secrets.SECUREBOOT_KEY }}
          SB_CERT: ${{ secrets.SECUREBOOT_CERT }}
        run: |
          umask 077
          printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/mok.key"
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/mok.crt"

      - name: Build unsealed image and kernel artifact
        run: |
          for target in kernel unsealed; do
            sudo podman build --pull=always \
              -f containers/Containerfile.unsealed --target "${target}" \
              -t "localhost/${target}:${TAG}" \
              --build-arg "BASE=${BASE}" \
              --build-arg "SIGNER=${TOOLS}" \
              --secret "id=key,src=${RUNNER_TEMP}/mok.key" \
              --secret "id=cert,src=${RUNNER_TEMP}/mok.crt" \
              .
          done

      - name: Chunk unsealed image
        run: |
          set -euo pipefail
          config="$(sudo podman inspect "localhost/unsealed:${TAG}")"
          sudo podman run --rm --network none --security-opt label=disable \
            --mount "type=image,src=localhost/unsealed:${TAG},destination=/chunkah" \
            -e CHUNKAH_CONFIG_STR="${config}" \
            "${CHUNKAH}" build --max-layers 64 -t "localhost/chunked:${TAG}" \
            | sudo podman load

      - name: Build sealed image
        run: |
          sudo podman build --pull=missing \
            -f containers/Containerfile.seal --target final \
            --build-arg "UNSEALED=localhost/chunked:${TAG}" \
            --build-arg "KERNEL=localhost/kernel:${TAG}" \
            --build-arg "TOOLS=${TOOLS}" \
            --build-arg "STRICT_BOOTC=1" \
            --secret "id=key,src=${RUNNER_TEMP}/mok.key" \
            --secret "id=cert,src=${RUNNER_TEMP}/mok.crt" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.base.name=${BASE%@*}" \
            --label "org.opencontainers.image.base.digest=${BASE##*@}" \
            -t "${IMAGE}:${TAG}" \
            .

      - name: Remove Secure Boot private key
        if: always()
        run: shred -u "$RUNNER_TEMP/mok.key" || true

      - name: Report sizes
        run: |
          {
            echo "### Dimensioni"
            echo "- layer: $(sudo podman image inspect --format "{{len .RootFS.Layers}}" "${IMAGE}:${TAG}")"
            for img in "localhost/unsealed:${TAG}" "${IMAGE}:${TAG}"; do
              echo "- ${img}: $(sudo podman image inspect --format '{{.Size}}' "${img}" | numfmt --to=iec)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify signatures and units
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sbsigntool
          sudo podman run --rm "${IMAGE}:${TAG}" sh -c 'cat /boot/EFI/Linux/*.efi' > "$RUNNER_TEMP/uki.efi"
          sudo podman run --rm "${IMAGE}:${TAG}" cat /usr/lib/systemd/boot/efi/systemd-bootx64.efi > "$RUNNER_TEMP/sdboot.efi"
          sbverify --cert "$RUNNER_TEMP/mok.crt" "$RUNNER_TEMP/uki.efi"
          sbverify --cert "$RUNNER_TEMP/mok.crt" "$RUNNER_TEMP/sdboot.efi"
          objcopy -O binary --only-section=.cmdline "$RUNNER_TEMP/uki.efi" "$RUNNER_TEMP/cmdline.txt"
          echo "cmdline UKI: $(tr -d '\0' < "$RUNNER_TEMP/cmdline.txt")"
          if grep -qE "composefs[.a-z0-9]*=[?]" "$RUNNER_TEMP/cmdline.txt"; then echo "ERRORE: fs-verity opzionale"; exit 1; fi
          for want in "composefs=" "rd.luks.options=tpm2-device=auto" "vconsole.keymap=it" "lockdown=integrity"; do
            grep -q -- "${want}" "$RUNNER_TEMP/cmdline.txt" \
              || { echo "ERRORE: la cmdline della UKI non contiene ${want}"; exit 1; }
          done

      - name: Chunk unsealed image
        run: |
          set -euo pipefail
          config="$(sudo podman inspect "localhost/unsealed:${TAG}")"
          sudo podman run --rm --network none --security-opt label=disable \
            --mount "type=image,src=localhost/unsealed:${TAG},destination=/chunkah" \
            -e CHUNKAH_CONFIG_STR="${config}" \
            "${CHUNKAH}" build --max-layers 64 -t "localhost/chunked:${TAG}" \
            | sudo podman load
          state="$(sudo podman run --rm "${IMAGE}:${TAG}" systemctl --root=/ is-enabled systemd-boot-update.service || true)"
          echo "systemd-boot-update.service: ${state}"
          case "${state}" in
            enabled) ;;
            *) echo "ERRORE: systemd-boot-update.service non è abilitato (${state})"; exit 1 ;;
          esac
          {
            echo "### ${IMAGE}:${TAG}"
            echo "- certificato: $(openssl x509 -in "$RUNNER_TEMP/mok.crt" -noout -fingerprint -sha256)"
            echo "- UKI: $(ls -lh "$RUNNER_TEMP/uki.efi" | awk '{print $5}')"
            echo "- systemd-boot-update: ${state}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rehearsal - bootc install su disco loopback
        run: |
          sudo mkdir -p /mnt/rehearsal
          sudo truncate -s 24G /mnt/rehearsal/disk.raw
          sudo podman run --rm --privileged --pid=host --security-opt label=disable \
            -v /dev:/dev \
            -v /var/lib/containers:/var/lib/containers \
            -v /mnt/rehearsal:/data \
            "${IMAGE}:${TAG}" \
            bootc install to-disk --via-loopback --composefs-backend \
            --bootloader systemd --filesystem ext4 /data/disk.raw

      - name: Push sealed image (tag con timestamp)
        run: |
          set -euo pipefail
          sudo podman push --digestfile "$RUNNER_TEMP/digest" "${IMAGE}:${TAG}"
          echo "DIGEST=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_ENV"


      - name: Sign sealed image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          cosign verify --key cosign.pub "${IMAGE}@${DIGEST}" >/dev/null

      - name: Publish sealed tag
        run: |
          set -euo pipefail
          sudo skopeo copy --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:sealed"

      - name: Remove signing keys
        if: always()
        run: shred -u "$RUNNER_TEMP/mok.key" "$RUNNER_TEMP/mok.crt" || true

      - name: Verify published tag
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub "${IMAGE}:sealed" >/dev/null
          published="$(sudo skopeo inspect --format "{{.Digest}}" "docker://${IMAGE}:sealed")"
          test "${published}" = "${DIGEST}"
