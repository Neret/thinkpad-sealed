[Distribution]
Distribution=fedora
Release=45

[Output]
Format=disk
Output=sealed-installer

[Content]
Bootable=yes
Bootloader=systemd-boot
Autologin=yes
ExtraTrees=SEALED_IMAGE:/SEALED_IMAGE
Packages=
    kernel
    dracut
    systemd
    systemd-boot-unsigned
    NetworkManager
    NetworkManager-wifi
    NetworkManager-tui
    linux-firmware
    podman
    skopeo
    shim-x64
    efibootmgr
    cryptsetup
    tpm2-tools
    btrfs-progs
    dosfstools
    parted
    util-linux
    bash
    openssl
