    # - make
    # - gdb
    # - mise (richiede un repository aggiuntivo o installazione separata)

    # ---------------------------------------------------------
    # Diagnostica hardware — host
    # ---------------------------------------------------------
    - pciutils
    - usbutils
    - dmidecode
    - smartmontools
    - nvme-cli
    - tcpdump

