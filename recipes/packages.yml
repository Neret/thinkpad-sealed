    - systemd-boot-unsigned
    - shim-x64
    - mokutil
    - efibootmgr
    - openssl
    - fprintd
    - fprintd-pam
    - zram-generator-defaults

    # Audio, power, and firmware updates
    - pipewire
    - pipewire-pulseaudio
    - wireplumber
    - alsa-ucm
    - upower
    - power-profiles-daemon
    - fwupd

    # ---------------------------------------------------------
    # Firmware e hardware ThinkPad T14s Gen 1 AMD
    # ---------------------------------------------------------
    - amd-gpu-firmware
    - amd-ucode-firmware
    - iwlwifi-mvm-firmware
    - mesa-dri-drivers
    - mesa-vulkan-drivers

    # Flatpak applications are installed separately by flatpaks.yml
    - flatpak

    # Italian and English locales
    - glibc-langpack-it
    - glibc-langpack-en

    # User shell and command-line tools
    - zsh
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - shadow-utils
    - zoxide
    - bat
    - eza
    - fd-find
    - fzf
    - ripgrep
    - ugrep
    - micro
    - git-core
    - which
    - curl
    - tar
    - ncurses
    - sudo
    - nano
