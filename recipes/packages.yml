# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
---
type: dnf
repos:
  cleanup: true

install:
  packages:
    # ---------------------------------------------------------
    # GNOME Desktop — componenti host
    # ---------------------------------------------------------
    - gdm
    - gnome-shell
    - gnome-session
    - gnome-session-wayland-session
    - gnome-settings-daemon
    - gnome-control-center
    - gnome-initial-setup
    - gnome-keyring
    - gnome-keyring-pam
    - gnome-bluetooth
    - nautilus
    - ptyxis
    - gvfs
    - gvfs-mtp
    - gvfs-smb
    - plymouth
    - udisks2
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome
    - xdg-desktop-portal-gtk
    - xdg-user-dirs
    - xdg-user-dirs-gtk
    - xdg-utils
    # - gnome-tweaks
    # - gnome-shell-extension-gsconnect
    # - gnome-extensions-app

    # Supporto per filesystem e dispositivi rimovibili
    - btrfs-progs
    - dosfstools
    - exfatprogs
    - ntfs-3g
    - udftools
    - xfsprogs

    # ---------------------------------------------------------
    # Networking
    # ---------------------------------------------------------
    - NetworkManager
    - NetworkManager-wifi
    - NetworkManager-bluetooth
    - wpa_supplicant
    - openssh-clients
