---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: fedora-bootc-sealed-os
description: Minimal Fedora bootc GNOME image for the ThinkPad T14s Gen 1 AMD
base-image: ghcr.io/neret/fedora-bootc-sealed-os-minimal-base
image-version: 45

modules:
  - from-file: packages.yml

  - type: files
    files:
      - source: system
        destination: /
  - type: gschema-overrides
    include:
      - zz0-thinkpad.gschema.override

  - type: script
    scripts:
      - assets.sh
    snippets:
      - useradd -D -s /usr/bin/zsh
      - ln -sf /usr/lib/systemd/system/graphical.target /etc/systemd/system/default.target
      - chmod 0644 /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy
      - chown root:root /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy
      - mkdir -p /efi
      - chmod 0755 /usr/bin/sealed-esp-update
      - 'authselect enable-feature with-fingerprint || echo "WARN - authselect non configurato, fprintd non attivo in PAM"'

  - type: systemd
    system:
      enabled:
        - gdm.service
        - NetworkManager.service
        - systemd-resolved.service
        - chronyd.service
        - bluetooth.service
        - firewalld.service
        - power-profiles-daemon.service
        - systemd-boot-update.service
        - systemd-oomd.service
        - sealed-bootc-stage.timer
      disabled:
        - NetworkManager-wait-online.service
    user:
      enabled:
        - podman.socket

  - type: script
    snippets:
      - kver="$(ls -1 /usr/lib/modules | sort -V | tail -n1)" && dracut --force --reproducible --no-hostonly --omit "nfs iscsi nvmf mdraid dmraid multipath lvm" --add bootc --kver "$kver" "/usr/lib/modules/$kver/initramfs.img"

  - from-file: flatpaks.yml

  - type: signing

  - type: script
    snippets:
      - sed -i 's|ghcr.io/Neret/|ghcr.io/neret/|g' /etc/containers/policy.json /etc/containers/registries.d/*.yaml
      - grep -q 'ghcr.io/neret/fedora-bootc-sealed-os' /etc/containers/policy.json
      - grep -q 'ghcr.io/neret/fedora-bootc-sealed-os' /etc/containers/registries.d/*.yaml
