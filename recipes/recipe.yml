---
version: 1
name: fedora-bootc-sealed-os
description: Minimal Fedora bootc GNOME image for the ThinkPad T14s Gen 1 AMD
base-image: ghcr.io/neret/fedora-bootc-sealed-os-minimal-base
image-version: 45

modules:
  - from-file: packages.yml

  - type: files
    files:
      - source: system
        destination: /
  - type: gschema-overrides
    include:
      - zz0-thinkpad.gschema.override

  - type: script
    scripts:
      - assets.sh
    snippets:
      - useradd -D -s /usr/bin/zsh
      - sed -i "s/grep -q runc/grep -q 'name: runc'/" /usr/bin/distrobox-create
      - ln -sf /usr/lib/systemd/system/graphical.target /etc/systemd/system/default.target
      - chmod 0644 /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy
      - chown root:root /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy

  - type: systemd
    system:
      enabled:
        - gdm.service
        - NetworkManager.service
        - systemd-resolved.service
        - bluetooth.service
        - firewalld.service
        - power-profiles-daemon.service
        - systemd-boot-update.service

 
  - type: script
    snippets:
      - kver="$(ls -1 /usr/lib/modules | sort -V | tail -n1)" && dracut --force --no-hostonly --add bootc --kver "$kver" "/usr/lib/modules/$kver/initramfs.img"

  - from-file: flatpaks.yml

  - type: signing
